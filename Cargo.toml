[package]
name = "postgel"
version = "0.1.0"
edition = "2024"

[lib]
name = "postgel"
path = "src/lib.rs"

[[bin]]
name = "postgel"
path = "src/main.rs"

[dependencies]
raunch = "1.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "io-std", "time", "process"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.30.1", features = ["process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
directories = "5"
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"
plist = "1"
chrono = { version = "0.4", features = ["serde"] }
users = "0.11"